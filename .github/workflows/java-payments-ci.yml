# Enterprise-shaped GitHub Actions pipeline (banking Java microservice).
# Fictional demo content — not a customer artifact.
name: Consumer Payments Java CI

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_scan:
        description: Skip SAST/SCA (emergency hotfix only)
        required: false
        type: boolean
        default: false

env:
  JAVA_VERSION: "17"
  MAVEN_OPTS: "-Xmx2g"
  IMAGE_NAME: 123456789012.dkr.ecr.us-east-1.amazonaws.com/consumer-payments
  SONAR_HOST: https://sonarqube.internal.example.com

permissions:
  contents: read
  id-token: write
  security-events: write
  packages: write

concurrency:
  group: payments-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build Test Quality
    runs-on: [self-hosted, linux, x64, enterprise]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Maven verify
        run: mvn -B -ntp verify -DskipITs=false

      - name: Publish JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: "**/target/surefire-reports/*.xml"

      - name: SonarQube scan
        if: ${{ github.event.inputs.skip_scan != 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B -ntp sonar:sonar -Dsonar.host.url=${{ env.SONAR_HOST }} -Dsonar.projectKey=consumer-payments

      - name: Checkmarx SAST
        if: ${{ github.event.inputs.skip_scan != 'true' }}
        uses: checkmarx-ts/checkmarx-cxflow-github-action@v1.6
        with:
          project: consumer-payments
          team: CxServer/SP/Banking/Payments
          checkmarx_url: ${{ secrets.CX_URL }}
          checkmarx_username: ${{ secrets.CX_USER }}
          checkmarx_password: ${{ secrets.CX_PASSWORD }}

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  publish:
    name: Container Publish
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, enterprise]
    environment: artifactory
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/gha-payments-ecr
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy_nonprod:
    name: Helm deploy nonprod
    needs: publish
    runs-on: [self-hosted, linux, x64, enterprise]
    environment: nonprod
    steps:
      - uses: actions/checkout@v4
      - name: Helm upgrade nonprod
        run: |
          helm upgrade --install consumer-payments ./charts/consumer-payments \
            --namespace payments-nonprod \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 10m
