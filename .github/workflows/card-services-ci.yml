# Thin caller — typical enterprise pattern: app repo calls org reusable CI.
name: Card Services CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pipeline:
    uses: ./.github/workflows/reusable-enterprise-ci.yml
    with:
      language: java
      working_directory: services/card-processor
      image_name: 123456789012.dkr.ecr.us-east-1.amazonaws.com/card-processor
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
