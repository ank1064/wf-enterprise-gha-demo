# Enterprise-shaped GitHub Actions pipeline (digital banking web frontend).
name: Digital Banking Web CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/digital-web-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  WORKING_DIR: apps/web
  IMAGE_NAME: ghcr.io/example-bank/digital-web

permissions:
  contents: read
  packages: write
  pull-requests: write
  security-events: write
  id-token: write

jobs:
  ci:
    name: Lint Test Build Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --coverage --ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/web/coverage/lcov.info

      - name: Build
        run: npm run build

      - name: Snyk SCA
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on=all
          command: test

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Filesystem Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: apps/web
          severity: CRITICAL,HIGH
          exit-code: "1"

  docker:
    name: Image
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          context: apps/web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_dev:
    name: Deploy Dev
    needs: docker
    runs-on: ubuntu-latest
    environment:
      name: web-dev
      url: https://web-dev.internal.example.com
    steps:
      - uses: actions/checkout@v4
      - name: Helm deploy web-dev
        run: |
          helm upgrade --install digital-web ./charts/digital-web \
            --namespace web-dev \
            --set image.tag=${{ github.sha }} \
            --wait
