pipeline:
  name: WF Showcase Payments Remote Vars
  identifier: wf_showcase_payments_remote_vars
  projectIdentifier: CSETest1
  orgIdentifier: nglabs
  description: Remote Git-backed pipeline with variable mapping for live demo.
  tags:
    wf_demo: 'true'
    source: gha_mapper
    store: remote
  template:
    templateRef: wf_java_payments_ci
    versionLabel: v1
    templateInputs:
      properties:
        ci:
          codebase:
            connectorRef: <+input>
            repoName: <+input>
            build: <+input>
      stages:
      - stage:
          identifier: quality
          type: CI
          spec:
            infrastructure:
              spec:
                connectorRef: <+input>
                namespace: <+input>
      - stage:
          identifier: publish
          type: CI
          spec:
            infrastructure:
              spec:
                connectorRef: <+input>
                namespace: <+input>
      - stage:
          identifier: deploy_nonprod
          type: CI
          spec:
            infrastructure:
              spec:
                connectorRef: <+input>
                namespace: <+input>
  variables:
  - name: demo_repo
    type: String
    value: ank1064/wf-enterprise-gha-demo
  - name: demo_workflow
    type: String
    value: java-payments-ci.yml
  - name: IMAGE_NAME
    type: String
    value: 123456789012.dkr.ecr.us-east-1.amazonaws.com/consumer-payments
  - name: skip_scan
    type: String
    value: 'false'
  - name: MAVEN_OPTS
    type: String
    value: -Xmx2g
