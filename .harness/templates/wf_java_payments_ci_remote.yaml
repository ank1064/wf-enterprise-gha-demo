template:
  name: WF Java Payments CI Remote
  identifier: wf_java_payments_ci_remote
  versionLabel: v1
  type: Pipeline
  orgIdentifier: nglabs
  projectIdentifier: CSETest1
  description: Remote-store twin of wf_java_payments_ci for live demo (Git-backed template).
  tags:
    wf_demo: 'true'
    role: equivalent
    gha: 'true'
    store: remote
  spec:
    properties:
      ci:
        codebase:
          connectorRef: <+input>
          repoName: <+input>
          build: <+input>
    stages:
    - stage:
        name: Quality
        identifier: quality
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: <+input>
              namespace: <+input>
              os: Linux
          execution:
            steps:
            - step:
                type: Run
                name: Maven Verify
                identifier: maven_verify
                spec:
                  connectorRef: account.harnessImage
                  image: maven:3.9-eclipse-temurin-17
                  shell: Sh
                  command: mvn -B -ntp verify -DskipITs=false
            - step:
                type: Run
                name: SonarQube Scan
                identifier: sonar_scan
                spec:
                  connectorRef: account.harnessImage
                  image: maven:3.9-eclipse-temurin-17
                  shell: Sh
                  command: mvn -B -ntp sonar:sonar
    - stage:
        name: Container Publish
        identifier: publish
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: <+input>
              namespace: <+input>
              os: Linux
          execution:
            steps:
            - step:
                type: Run
                name: Build Push Placeholder
                identifier: build_push
                spec:
                  connectorRef: account.harnessImage
                  image: maven:3.9-eclipse-temurin-17
                  shell: Sh
                  command: echo build-and-push
    - stage:
        name: Helm deploy nonprod
        identifier: deploy_nonprod
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: <+input>
              namespace: <+input>
              os: Linux
          execution:
            steps:
            - step:
                type: Run
                name: Helm Upgrade Nonprod
                identifier: helm_upgrade_nonprod
                spec:
                  connectorRef: account.harnessImage
                  image: alpine/helm:3.14.0
                  shell: Sh
                  command: echo helm-upgrade
